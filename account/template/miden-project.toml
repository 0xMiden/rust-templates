# The package name is hyphenated so it matches how dependents reference this
# contract (e.g. `add-contract = { path = "../add-contract" }`); a dependency's
# declared name must equal the resolved package's name.
[package]
name = "{{crate_name | replace: "_", "-" }}"
version = "0.1.0"

[lib]
kind = "account-component"
namespace = "miden:{{crate_name | replace: "_", "-" }}/miden-{{crate_name | replace: "_", "-" }}@0.1.0"

[dependencies]
miden-core = "=0.22.3"
miden-protocol = "=0.14.0"

[package.metadata.miden]
supported-types = ["RegularAccountUpdatableCode"]
